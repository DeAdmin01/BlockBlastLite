<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Ocean Depths Ambient Background -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Shark Skin Gradient -->
    <linearGradient id="sharkBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Shark Mouth Gradient -->
    <radialGradient id="mouthDeep" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
  </defs>

  <!-- 1. Deep Ocean Squircle Base -->
  <rect width="128" height="128" rx="24" fill="url(#oceanBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- Sunlight Rays in Water -->
  <path d="M 0 0 L 32 0 L 16 70 Z" fill="#ffffff" opacity="0.08"/>
  <path d="M 40 0 L 85 0 L 70 90 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M 95 0 L 128 0 L 120 70 Z" fill="#ffffff" opacity="0.08"/>

  <!-- 2. Perky Dorsal Fin (Top) -->
  <path d="M 52 38 C 50 14, 66 4, 76 2 C 76 16, 72 32, 62 38 Z"
        fill="#0284c7" stroke="#075985" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Fin Highlight -->
  <path d="M 58 24 C 64 12, 70 8, 73 5" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 3. Chibi Shark Main Body -->
  <path d="M 12 78 C 12 36, 44 26, 88 32 C 114 36, 122 56, 122 76 C 122 98, 102 118, 64 118 C 30 118, 12 104, 12 78 Z"
        fill="url(#sharkBody)" stroke="#075985" stroke-width="3"/>

  <!-- 4. Soft White Underbelly / Jaw -->
  <path d="M 22 84 C 28 66, 60 62, 94 66 C 112 68, 118 80, 116 92 C 112 108, 92 116, 64 116 C 40 116, 26 106, 22 84 Z"
        fill="#f8fafc" stroke="#075985" stroke-width="2"/>

  <!-- 5. Big Adorable Anime/Cartoon Shark Eyes -->
  <!-- Left Eye -->
  <g transform="translate(38, 48)">
    <circle cx="0" cy="0" r="11" fill="#0f172a" stroke="#075985" stroke-width="1.5"/>
    <circle cx="-3" cy="-3" r="4.5" fill="#ffffff"/>
    <circle cx="3.5" cy="3.5" r="2" fill="#ffffff"/>
  </g>
  <!-- Right Eye -->
  <g transform="translate(82, 50)">
    <circle cx="0" cy="0" r="11" fill="#0f172a" stroke="#075985" stroke-width="1.5"/>
    <circle cx="-3" cy="-3" r="4.5" fill="#ffffff"/>
    <circle cx="3.5" cy="3.5" r="2" fill="#ffffff"/>
  </g>

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="26" cy="62" rx="6" ry="4" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="94" cy="64" rx="6" ry="4" fill="#38bdf8" opacity="0.6"/>

  <!-- 6. Iconic Cheerful Open Shark Grin -->
  <path d="M 38 78 Q 62 104 88 78 Z" fill="url(#mouthDeep)" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Cute Pink Tongue -->
  <path d="M 52 90 Q 62 82 72 90 Q 62 102 52 90 Z" fill="#fb7185"/>

  <!-- Sharp White Triangle Teeth -->
  <!-- Upper Row -->
  <polygon points="43,78 48,78 45.5,84" fill="#ffffff"/>
  <polygon points="50,78 55,78 52.5,85" fill="#ffffff"/>
  <polygon points="57,78 62,78 59.5,85" fill="#ffffff"/>
  <polygon points="64,78 69,78 66.5,85" fill="#ffffff"/>
  <polygon points="71,78 76,78 73.5,85" fill="#ffffff"/>
  <polygon points="78,78 83,78 80.5,84" fill="#ffffff"/>

  <!-- 7. Shark Gills (Left Flank) -->
  <path d="M 18 64 Q 22 70 18 76" stroke="#0369a1" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 23 66 Q 27 71 23 76" stroke="#0369a1" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 8. Floating Water Bubbles -->
  <circle cx="106" cy="32" r="5" fill="none" stroke="#bae6fd" stroke-width="1.8" opacity="0.8"/>
  <circle cx="104" cy="30" r="1.5" fill="#ffffff" opacity="0.9"/>

  <circle cx="116" cy="18" r="3.5" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.8"/>
  <circle cx="115" cy="17" r="1" fill="#ffffff" opacity="0.9"/>

  <circle cx="18" cy="28" r="4" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.6"/>
</svg>
