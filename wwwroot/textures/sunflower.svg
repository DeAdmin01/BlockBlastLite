<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Warm Meadow Ambient Background -->
    <radialGradient id="sunBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#291505"/>
      <stop offset="100%" stop-color="#140801"/>
    </radialGradient>

    <!-- Outer Petals (Deep Gold) -->
    <linearGradient id="petalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Inner Petals (Bright Sunshine) -->
    <linearGradient id="petalBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff07c"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Seed Disc 3D Gradient -->
    <radialGradient id="seedCore" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#260e02"/>
    </radialGradient>

    <!-- Ladybug Red Gradient -->
    <radialGradient id="ladybugGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <!-- 1. Rich Warm Backing (Squircle Block Base) -->
  <rect width="128" height="128" rx="24" fill="url(#sunBg)"/>
  <!-- Subtle Golden Rim -->
  <rect x="2" y="2" width="124" height="124" rx="22" fill="none" stroke="#facc15" stroke-width="2" opacity="0.35"/>

  <!-- 2. LAYER 1: 12 Outer Golden Petals (Plump & Rounded) -->
  <g fill="url(#petalDark)" stroke="#b45309" stroke-width="1.2">
    <!-- 0 deg (Top) -->
    <path d="M 64 64 C 54 48, 50 20, 64 10 C 78 20, 74 48, 64 64 Z"/>
    <!-- 30 deg -->
    <path d="M 64 64 C 73 50, 92 28, 104 22 C 108 36, 88 56, 64 64 Z"/>
    <!-- 60 deg -->
    <path d="M 64 64 C 78 56, 108 46, 118 40 C 116 54, 94 68, 64 64 Z"/>
    <!-- 90 deg (Right) -->
    <path d="M 64 64 C 80 54, 108 50, 118 64 C 108 78, 80 74, 64 64 Z"/>
    <!-- 120 deg -->
    <path d="M 64 64 C 78 72, 108 82, 118 88 C 108 94, 78 82, 64 64 Z"/>
    <!-- 150 deg -->
    <path d="M 64 64 C 73 78, 92 100, 104 106 C 90 108, 70 88, 64 64 Z"/>
    <!-- 180 deg (Bottom) -->
    <path d="M 64 64 C 74 80, 78 108, 64 118 C 50 108, 54 80, 64 64 Z"/>
    <!-- 210 deg -->
    <path d="M 64 64 C 55 78, 36 100, 24 106 C 20 92, 40 72, 64 64 Z"/>
    <!-- 240 deg -->
    <path d="M 64 64 C 50 72, 20 82, 10 88 C 12 74, 34 60, 64 64 Z"/>
    <!-- 270 deg (Left) -->
    <path d="M 64 64 C 48 74, 20 78, 10 64 C 20 50, 48 54, 64 64 Z"/>
    <!-- 300 deg -->
    <path d="M 64 64 C 50 56, 20 46, 10 40 C 20 34, 50 46, 64 64 Z"/>
    <!-- 330 deg -->
    <path d="M 64 64 C 55 50, 36 28, 24 22 C 38 20, 58 40, 64 64 Z"/>
  </g>

  <!-- 3. LAYER 2: 12 Inner Bright Sunshine Petals (Offset & Overlapping) -->
  <g fill="url(#petalBright)" stroke="#d97706" stroke-width="1.2">
    <!-- 15 deg -->
    <path d="M 64 64 C 59 47, 68 24, 85 14 C 92 27, 78 52, 64 64 Z"/>
    <!-- 45 deg -->
    <path d="M 64 64 C 71 52, 98 34, 111 31 C 111 46, 88 59, 64 64 Z"/>
    <!-- 75 deg -->
    <path d="M 64 64 C 77 58, 110 57, 121 52 C 114 66, 85 68, 64 64 Z"/>
    <!-- 105 deg -->
    <path d="M 64 64 C 77 70, 110 71, 121 76 C 110 90, 85 79, 64 64 Z"/>
    <!-- 135 deg -->
    <path d="M 64 64 C 71 76, 98 94, 111 97 C 98 107, 78 88, 64 64 Z"/>
    <!-- 165 deg -->
    <path d="M 64 64 C 59 81, 68 104, 85 114 C 70 114, 66 94, 64 64 Z"/>
    <!-- 195 deg -->
    <path d="M 64 64 C 69 81, 60 104, 43 114 C 36 101, 50 76, 64 64 Z"/>
    <!-- 225 deg -->
    <path d="M 64 64 C 57 76, 30 94, 17 97 C 17 82, 40 69, 64 64 Z"/>
    <!-- 255 deg -->
    <path d="M 64 64 C 51 70, 18 71, 7 76 C 14 62, 43 60, 64 64 Z"/>
    <!-- 285 deg -->
    <path d="M 64 64 C 51 58, 18 57, 7 52 C 18 38, 43 49, 64 64 Z"/>
    <!-- 315 deg -->
    <path d="M 64 64 C 57 52, 30 34, 17 31 C 30 21, 50 40, 64 64 Z"/>
    <!-- 345 deg -->
    <path d="M 64 64 C 69 47, 60 24, 43 14 C 58 14, 62 34, 64 64 Z"/>
  </g>

  <!-- 4. Big Rounded Chocolate Seed Disc (Raised 3D Button) -->
  <circle cx="64" cy="64" r="28" fill="url(#seedCore)" stroke="#92400e" stroke-width="2.5"/>
  <!-- Disc Highlight Rim -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>

  <!-- Seed Texture (Concentric spiral dots & golden pollen grains) -->
  <g fill="#fde047" opacity="0.85">
    <circle cx="64" cy="64" r="2.5"/>
    <!-- Ring 1 -->
    <circle cx="64" cy="56" r="1.5"/><circle cx="70" cy="59" r="1.5"/><circle cx="71" cy="67" r="1.5"/>
    <circle cx="66" cy="72" r="1.5"/><circle cx="58" cy="70" r="1.5"/><circle cx="57" cy="62" r="1.5"/>
    <!-- Ring 2 -->
    <circle cx="64" cy="48" r="1.8"/><circle cx="73" cy="51" r="1.8"/><circle cx="78" cy="60" r="1.8"/>
    <circle cx="76" cy="70" r="1.8"/><circle cx="68" cy="77" r="1.8"/><circle cx="58" cy="77" r="1.8"/>
    <circle cx="51" cy="69" r="1.8"/><circle cx="50" cy="58" r="1.8"/><circle cx="56" cy="50" r="1.8"/>
    <!-- Ring 3 -->
    <circle cx="64" cy="41" r="2"/><circle cx="76" cy="44" r="2"/><circle cx="84" cy="54" r="2"/>
    <circle cx="83" cy="68" r="2"/><circle cx="76" cy="79" r="2"/><circle cx="64" cy="85" r="2"/>
    <circle cx="52" cy="79" r="2"/><circle cx="45" cy="68" r="2"/><circle cx="44" cy="54" r="2"/>
    <circle cx="52" cy="44" r="2"/>
  </g>

  <!-- 5. Adorable Tiny Cartoon Ladybug (Bottom-Right Petal) -->
  <g transform="translate(86, 78) rotate(-25)">
    <!-- Shadow -->
    <ellipse cx="8" cy="10" rx="9" ry="7" fill="#000000" opacity="0.4"/>
    <!-- Red Body Shell -->
    <ellipse cx="8" cy="8" rx="8" ry="7" fill="url(#ladybugGrad)" stroke="#7f1d1d" stroke-width="1"/>
    <!-- Black Head -->
    <ellipse cx="2" cy="8" rx="3.5" ry="4" fill="#0f172a"/>
    <!-- Head Eye Dots -->
    <circle cx="1.5" cy="6.5" r="0.8" fill="#ffffff"/>
    <circle cx="1.5" cy="9.5" r="0.8" fill="#ffffff"/>
    <!-- Center Wing Divider -->
    <line x1="2" y1="8" x2="16" y2="8" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Black Polka Dots -->
    <circle cx="7" cy="5" r="1.4" fill="#0f172a"/>
    <circle cx="7" cy="11" r="1.4" fill="#0f172a"/>
    <circle cx="12" cy="6" r="1.2" fill="#0f172a"/>
    <circle cx="12" cy="10" r="1.2" fill="#0f172a"/>
    <!-- Shell Gloss -->
    <ellipse cx="6" cy="5" rx="3" ry="1.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- 6. Glistening Dewdrop & Gleam (Top-Left Petal) -->
  <ellipse cx="40" cy="30" rx="6" ry="4" transform="rotate(-30 40 30)" fill="#ffffff" opacity="0.7"/>
  <circle cx="38" cy="28" r="2" fill="#ffffff"/>
</svg>
