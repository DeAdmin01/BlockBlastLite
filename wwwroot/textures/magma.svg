  <path d="M48,0 L44,46 L0,44 M52,42 L48,94 L0,88 M92,0 L88,46 L128,40 M86,46 L88,90 L128,88 M48,94 L46,128 M88,90 L86,128 M44,46 L88,46 M48,94 L88,90" 
        fill="none" stroke="#ff3d00" stroke-width="8" opacity="0.85"/>

  <!-- Intense Radiant Lava Core -->
  <path d="M48,0 L44,46 L0,44 M52,42 L48,94 L0,88 M92,0 L88,46 L128,40 M86,46 L88,90 L128,88 M48,94 L46,128 M88,90 L86,128 M44,46 L88,46 M48,94 L88,90" 
        fill="none" stroke="#ff9100" stroke-width="4.5"/>

  <!-- White-Hot Incandescent Centerline -->
  <path d="M48,2 L44,46 L2,44 M52,42 L48,94 L2,88 M92,2 L88,46 L126,40 M86,46 L88,90 L126,88 M48,94 L46,126 M88,90 L86,126 M44,46 L88,46 M48,94 L88,90" 
        fill="none" stroke="#ffffaa" stroke-width="2"/>

  <!-- Glowing Embers on basalt (Layered vector halos) -->
  <circle cx="22" cy="24" r="5" fill="#ff3d00" opacity="0.3"/>
  <circle cx="22" cy="24" r="2.5" fill="#ffab00"/>
  <circle cx="85" cy="20" r="5.5" fill="#ff3d00" opacity="0.3"/>
  <circle cx="85" cy="20" r="3" fill="#ff5722"/>
  <circle cx="20" cy="68" r="2" fill="#ff9100"/>
  <circle cx="66" cy="68" r="6" fill="#ff3d00" opacity="0.35"/>
  <circle cx="66" cy="68" r="3.5" fill="#ffd600"/>
  <circle cx="106" cy="66" r="2.5" fill="#ff3d00"/>
  <circle cx="24" cy="108" r="5.5" fill="#ff3d00" opacity="0.3"/>
