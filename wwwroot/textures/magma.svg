<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basaltPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2530"/>
      <stop offset="60%" stop-color="#24141e"/>
      <stop offset="100%" stop-color="#150a10"/>
    </linearGradient>
  </defs>

  <!-- Volcanic Nether Stone Base -->
  <rect width="128" height="128" rx="8" fill="#13090e"/>

  <!-- Basalt Crust Chunks -->
  <polygon points="6,6 48,6 44,44 6,40" fill="url(#basaltPlate)"/>
  <polygon points="56,6 122,6 118,36 52,40" fill="url(#basaltPlate)"/>
  <polygon points="6,48 40,52 36,88 6,84" fill="url(#basaltPlate)"/>
  <polygon points="48,48 88,46 84,86 44,90" fill="url(#basaltPlate)"/>
  <polygon points="96,44 122,42 122,86 92,84" fill="url(#basaltPlate)"/>
  <polygon points="6,92 40,96 38,122 6,122" fill="url(#basaltPlate)"/>
  <polygon points="46,98 84,94 82,122 44,122" fill="url(#basaltPlate)"/>
  <polygon points="90,92 122,94 122,122 88,122" fill="url(#basaltPlate)"/>

  <!-- Crust Bevel Highlights (Specular rim on hard basalt) -->
  <path d="M6,6 L48,6 M56,6 L122,6 M6,48 L40,52 M48,48 L88,46 M96,44 L122,42" fill="none" stroke="#684555" stroke-width="1.5" opacity="0.6"/>

  <!-- Molten Lava Channels: Broad Fiery Glow Base (Layered vector paths, zero filter cost) -->
  <path d="M48,0 L44,46 L0,44 M52,42 L48,94 L0,88 M92,0 L88,46 L128,40 M86,46 L88,90 L128,88 M48,94 L46,128 M88,90 L86,128 M44,46 L88,46 M48,94 L88,90" 
