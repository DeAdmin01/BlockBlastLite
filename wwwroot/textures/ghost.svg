<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Midnight Purple Ectoplasm Background -->
    <radialGradient id="ghostBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="60%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f051d"/>
    </radialGradient>

    <!-- Glowing Ghost Body Gradient -->
    <linearGradient id="ghostBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>

    <filter id="ghostGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Midnight Base -->
  <rect width="128" height="128" rx="16" fill="url(#ghostBg)"/>

  <!-- Ghost Aura Ectoplasmic Glow -->
  <ellipse cx="64" cy="62" rx="42" ry="46" fill="#818cf8" opacity="0.3" filter="url(#ghostGlow)"/>

  <!-- CUTE CARTOON GHOST BODY -->
  <g filter="url(#ghostGlow)">
    <path d="M 32,58 C 32,32 46,20 64,20 C 82,20 96,32 96,58 C 96,82 98,96 90,102 C 84,106 80,98 74,102 C 68,106 64,98 58,102 C 52,106 48,98 42,102 C 34,96 32,82 32,58 Z" fill="url(#ghostBody)" stroke="#c7d2fe" stroke-width="2"/>

    <!-- Ghost Cute Chubby Little Stubby Arms -->
    <!-- Left Hand -->
    <path d="M 34,60 C 22,64 20,72 26,76 C 32,80 36,70 38,66 Z" fill="url(#ghostBody)" stroke="#c7d2fe" stroke-width="1.8"/>
    <!-- Right Hand (Waving hello) -->
    <path d="M 94,60 C 106,56 112,62 108,68 C 104,74 98,68 94,66 Z" fill="url(#ghostBody)" stroke="#c7d2fe" stroke-width="1.8"/>

    <!-- BIG ADORABLE STAR-STUDDED EYES -->
    <!-- Left Eye -->
    <circle cx="50" cy="52" r="7" fill="#1e1b4b"/>
    <circle cx="48" cy="50" r="2.8" fill="#ffffff"/>
    <circle cx="53" cy="55" r="1.3" fill="#ffffff"/>

    <!-- Right Eye -->
    <circle cx="78" cy="52" r="7" fill="#1e1b4b"/>
    <circle cx="76" cy="50" r="2.8" fill="#ffffff"/>
    <circle cx="81" cy="55" r="1.3" fill="#ffffff"/>

    <!-- Cute Open Mouth O / Smile -->
    <ellipse cx="64" cy="65" rx="4.5" ry="5.5" fill="#1e1b4b"/>
    <ellipse cx="64" cy="68" rx="2.5" ry="2" fill="#f43f5e"/>

    <!-- Pink Blushing Cheeks -->
    <ellipse cx="42" cy="62" rx="5" ry="3.5" fill="#f472b6" opacity="0.6"/>
    <ellipse cx="86" cy="62" rx="5" ry="3.5" fill="#f472b6" opacity="0.6"/>
  </g>

  <!-- Twinkling floating ghost soul-sparks -->
  <path d="M 22,28 L 24,20 L 26,28 L 34,30 L 26,32 L 24,40 L 22,32 L 14,30 Z" fill="#67e8f9" opacity="0.8"/>
  <path d="M 102,24 L 103.5,18 L 105,24 L 111,25.5 L 105,27 L 103.5,33 L 102,27 L 96,25.5 Z" fill="#fbcfe8" opacity="0.8"/>
  <circle cx="20" cy="94" r="2.5" fill="#67e8f9" opacity="0.75"/>
  <circle cx="108" cy="92" r="2" fill="#fbcfe8" opacity="0.75"/>

  <!-- Specular head highlight -->
  <ellipse cx="58" cy="28" rx="14" ry="6" transform="rotate(-15 58 28)" fill="#ffffff" opacity="0.6"/>

  <!-- Outer Neon Lilac Rim -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="15" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.85"/>
</svg>
