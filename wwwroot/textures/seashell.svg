<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fbcfe8"/>
      <stop offset="80%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="pearlGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>

  <!-- Ocean Sandy Bed -->
  <rect width="128" height="128" rx="20" fill="#0f172a"/>

  <!-- Shell Fan Radiating Grooves Base -->
  <path d="M 64 114 C 20 110, 10 70, 18 36 C 24 24, 40 18, 64 18 C 88 18, 104 24, 110 36 C 118 70, 108 110, 64 114 Z"
        fill="url(#shellGrad)" stroke="#f472b6" stroke-width="2"/>

  <!-- Shell Fan Ribs radiating from hinge -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="64" y1="108" x2="64" y2="20"/>
    <line x1="64" y1="108" x2="44" y2="24"/>
    <line x1="64" y1="108" x2="28" y2="36"/>
    <line x1="64" y1="108" x2="84" y2="24"/>
    <line x1="64" y1="108" x2="100" y2="36"/>
  </g>

  <!-- Shell Scalloped Edge Crests -->
  <path d="M 18 36 Q 28 22 40 22 Q 52 16 64 16 Q 76 16 88 22 Q 100 22 110 36"
        stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Pearlescent Golden Cushion for Pearl -->
  <ellipse cx="64" cy="94" rx="26" ry="12" fill="#fbbf24" opacity="0.4"/>

  <!-- Glowing Precious Pearl -->
  <circle cx="64" cy="84" r="18" fill="url(#pearlGrad)" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Pearl Shine Dots -->
  <circle cx="58" cy="78" r="5" fill="#ffffff"/>
  <circle cx="68" cy="88" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Sparkles -->
  <polygon points="34,44 36,49 41,51 36,53 34,58 32,53 27,51 32,49" fill="#ffffff"/>
  <polygon points="94,48 95,52 99,53 95,55 94,59 93,55 89,53 93,52" fill="#ffffff"/>
</svg>
