<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Icy Frost Blue Gradient -->
    <linearGradient id="iceBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ice Block Body -->
  <rect width="128" height="128" rx="14" fill="url(#iceBase)"/>

  <!-- Chunky Cartoon Frost Border -->
  <rect x="8" y="8" width="112" height="112" rx="10" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>
  <rect x="12" y="12" width="104" height="104" rx="8" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.35"/>

  <!-- Ornate Cartoon 6-Point Snowflake (Center) -->
  <g transform="translate(64,64)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#iceGlow)">
    <!-- Central Core Hexagon -->
    <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" fill="#bae6fd" stroke="#ffffff" stroke-width="1.5"/>

    <!-- 6 Main Crystal Arms -->
    <!-- Arm 1: Top -->
    <line x1="0" y1="-8" x2="0" y2="-38"/>
    <line x1="0" y1="-24" x2="-8" y2="-30"/>
    <line x1="0" y1="-24" x2="8" y2="-30"/>
    <polygon points="0,-44 -4,-38 0,-34 4,-38" fill="#ffffff"/>

    <!-- Arm 2: Bottom -->
    <line x1="0" y1="8" x2="0" y2="38"/>
    <line x1="0" y1="24" x2="-8" y2="30"/>
    <line x1="0" y1="24" x2="8" y2="30"/>
    <polygon points="0,44 -4,38 0,34 4,38" fill="#ffffff"/>

    <!-- Arm 3: Top-Right (60 deg) -->
    <g transform="rotate(60)">
      <line x1="0" y1="-8" x2="0" y2="-38"/>
      <line x1="0" y1="-24" x2="-8" y2="-30"/>
      <line x1="0" y1="-24" x2="8" y2="-30"/>
      <polygon points="0,-44 -4,-38 0,-34 4,-38" fill="#ffffff"/>
    </g>

    <!-- Arm 4: Bottom-Right (120 deg) -->
    <g transform="rotate(120)">
      <line x1="0" y1="-8" x2="0" y2="-38"/>
      <line x1="0" y1="-24" x2="-8" y2="-30"/>
      <line x1="0" y1="-24" x2="8" y2="-30"/>
      <polygon points="0,-44 -4,-38 0,-34 4,-38" fill="#ffffff"/>
    </g>

    <!-- Arm 5: Bottom-Left (240 deg) -->
    <g transform="rotate(240)">
      <line x1="0" y1="-8" x2="0" y2="-38"/>
      <line x1="0" y1="-24" x2="-8" y2="-30"/>
      <line x1="0" y1="-24" x2="8" y2="-30"/>
      <polygon points="0,-44 -4,-38 0,-34 4,-38" fill="#ffffff"/>
    </g>

    <!-- Arm 6: Top-Left (300 deg) -->
    <g transform="rotate(300)">
      <line x1="0" y1="-8" x2="0" y2="-38"/>
      <line x1="0" y1="-24" x2="-8" y2="-30"/>
      <line x1="0" y1="-24" x2="8" y2="-30"/>
      <polygon points="0,-44 -4,-38 0,-34 4,-38" fill="#ffffff"/>
    </g>
  </g>

  <!-- Twinkling Snow Dots & Mini Crystals -->
  <circle cx="24" cy="24" r="3.5" fill="#ffffff"/>
  <circle cx="104" cy="24" r="3" fill="#ffffff"/>
  <circle cx="24" cy="104" r="3" fill="#ffffff"/>
  <circle cx="104" cy="104" r="3.5" fill="#ffffff"/>

  <!-- Top Glass Highlight -->
  <path d="M16,14 Q64,26 112,14 Q64,8 16,14 Z" fill="#ffffff" opacity="0.6"/>
</svg>
