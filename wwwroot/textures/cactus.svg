<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Succulent Cactus Green Gradient -->
    <linearGradient id="cactusBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Blooming Pink Flower Gradient -->
    <radialGradient id="flowerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="45%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
  </defs>

  <!-- Base Cactus Green Block (Full bleed) -->
  <rect width="128" height="128" rx="16" fill="url(#cactusBody)"/>

  <!-- Vertical Succulent Ribs (Deep ribbed longitudinal grooves) -->
  <path d="M 28,0 L 28,128" stroke="#166534" stroke-width="4" opacity="0.6"/>
  <path d="M 28,0 L 28,128" stroke="#86efac" stroke-width="1.8" opacity="0.7"/>

  <path d="M 52,0 L 52,128" stroke="#166534" stroke-width="4.5" opacity="0.6"/>
  <path d="M 52,0 L 52,128" stroke="#86efac" stroke-width="2" opacity="0.7"/>

  <path d="M 76,0 L 76,128" stroke="#166534" stroke-width="4.5" opacity="0.6"/>
  <path d="M 76,0 L 76,128" stroke="#86efac" stroke-width="2" opacity="0.7"/>

  <path d="M 100,0 L 100,128" stroke="#166534" stroke-width="4" opacity="0.6"/>
  <path d="M 100,0 L 100,128" stroke="#86efac" stroke-width="1.8" opacity="0.7"/>

  <!-- CARTOON CACTUS SPINES / NEEDLES (Cute star-shaped prickles) -->
  <!-- Left Rib Spines -->
  <g stroke="#fef08a" stroke-width="1.8" stroke-linecap="round">
    <!-- Spine 1 -->
    <path d="M 24,24 L 20,20 M 24,24 L 18,25 M 24,24 L 21,30"/>
    <circle cx="24" cy="24" r="1.5" fill="#facc15"/>
    <!-- Spine 2 -->
    <path d="M 24,68 L 20,64 M 24,68 L 18,69 M 24,68 L 21,74"/>
    <circle cx="24" cy="68" r="1.5" fill="#facc15"/>
    <!-- Spine 3 -->
    <path d="M 24,104 L 20,100 M 24,104 L 18,105 M 24,104 L 21,110"/>
    <circle cx="24" cy="104" r="1.5" fill="#facc15"/>
  </g>

  <!-- Center-Left Rib Spines -->
  <g stroke="#fef08a" stroke-width="1.8" stroke-linecap="round">
    <path d="M 52,44 L 46,40 M 52,44 L 58,38 M 52,44 L 52,52"/>
    <circle cx="52" cy="44" r="1.6" fill="#facc15"/>
    <path d="M 52,88 L 46,84 M 52,88 L 58,82 M 52,88 L 52,96"/>
    <circle cx="52" cy="88" r="1.6" fill="#facc15"/>
  </g>

  <!-- Center-Right Rib Spines -->
  <g stroke="#fef08a" stroke-width="1.8" stroke-linecap="round">
    <path d="M 76,44 L 70,38 M 76,44 L 82,40 M 76,44 L 76,52"/>
    <circle cx="76" cy="44" r="1.6" fill="#facc15"/>
    <path d="M 76,88 L 70,82 M 76,88 L 82,84 M 76,88 L 76,96"/>
    <circle cx="76" cy="88" r="1.6" fill="#facc15"/>
  </g>

  <!-- Right Rib Spines -->
  <g stroke="#fef08a" stroke-width="1.8" stroke-linecap="round">
    <path d="M 104,24 L 108,20 M 104,24 L 110,25 M 104,24 L 107,30"/>
    <circle cx="104" cy="24" r="1.5" fill="#facc15"/>
    <path d="M 104,68 L 108,64 M 104,68 L 110,69 M 104,68 L 107,74"/>
    <circle cx="104" cy="68" r="1.5" fill="#facc15"/>
    <path d="M 104,104 L 108,100 M 104,104 L 110,105 M 104,104 L 107,110"/>
    <circle cx="104" cy="104" r="1.5" fill="#facc15"/>
  </g>

  <!-- BLOOMING CACTUS FLOWER (Top Right) -->
  <g transform="translate(94, 26)">
    <!-- Petals -->
    <ellipse cx="0" cy="-8" rx="5" ry="9" fill="url(#flowerGrad)" stroke="#be185d" stroke-width="1"/>
    <ellipse cx="8" cy="-4" rx="5" ry="9" transform="rotate(50 8 -4)" fill="url(#flowerGrad)" stroke="#be185d" stroke-width="1"/>
    <ellipse cx="8" cy="6" rx="5" ry="9" transform="rotate(110 8 6)" fill="url(#flowerGrad)" stroke="#be185d" stroke-width="1"/>
    <ellipse cx="-4" cy="8" rx="5" ry="9" transform="rotate(170 -4 8)" fill="url(#flowerGrad)" stroke="#be185d" stroke-width="1"/>
    <ellipse cx="-8" cy="-2" rx="5" ry="9" transform="rotate(230 -8 -2)" fill="url(#flowerGrad)" stroke="#be185d" stroke-width="1"/>
    <!-- Golden Pollen Center -->
    <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/>
    <circle cx="-1" cy="-1" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Top Specular Shine Arc -->
  <path d="M 16,12 Q 64,20 112,12" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- Outer Cartoon Rim -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="15" fill="none" stroke="#14532d" stroke-width="3" opacity="0.85"/>
</svg>
