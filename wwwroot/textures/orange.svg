<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Vibrant Rind Gradient -->
    <linearGradient id="orangeRind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a3c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Pulp Radial Ambient -->
    <radialGradient id="pulpBed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="65%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>

    <!-- Individual Segment Gradient -->
    <linearGradient id="juiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="orangeLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- 1. Thick Glossy Orange Peel (Squircle Block Base) -->
  <rect width="128" height="128" rx="24" fill="url(#orangeRind)"/>
  <!-- Outer Bevel Edge Highlight -->
  <rect x="2" y="2" width="124" height="124" rx="22" fill="none" stroke="#ffedd5" stroke-width="2.5" opacity="0.45"/>
  <rect x="4" y="4" width="120" height="120" rx="20" fill="none" stroke="#9a3412" stroke-width="1.5" opacity="0.3"/>

  <!-- 2. Soft Cream White Pith Ring -->
  <circle cx="64" cy="65" r="49" fill="url(#pulpBed)"/>

  <!-- 3. Sliced Pulp Segments (8 juicy wedges with rounded plump corners) -->
  <g fill="url(#juiceGrad)" stroke="#ffedd5" stroke-width="2.2" stroke-linejoin="round">
    <!-- North -->
    <path d="M 57 21 C 61 20, 67 20, 71 21 C 74 36, 73 45, 68 54 C 65 55, 63 55, 60 54 C 55 45, 54 36, 57 21 Z"/>
    <!-- North-East -->
    <path d="M 78 26 C 84 30, 89 35, 93 40 C 84 52, 77 58, 69 60 C 67 58, 66 56, 67 53 C 71 45, 74 36, 78 26 Z"/>
    <!-- East -->
    <path d="M 108 58 C 109 63, 109 67, 108 72 C 94 74, 84 73, 75 69 C 74 66, 74 63, 75 61 C 84 57, 94 56, 108 58 Z"/>
    <!-- South-East -->
    <path d="M 94 90 C 89 95, 84 99, 78 103 C 74 93, 71 84, 67 76 C 66 74, 68 72, 70 70 C 78 72, 85 78, 94 90 Z"/>
    <!-- South -->
    <path d="M 71 108 C 67 109, 61 109, 57 108 C 54 94, 55 84, 60 76 C 63 75, 65 75, 68 76 C 73 84, 74 94, 71 108 Z"/>
    <!-- South-West -->
    <path d="M 50 103 C 44 99, 39 95, 34 90 C 43 78, 50 72, 58 70 C 60 72, 62 74, 61 76 C 57 84, 54 93, 50 103 Z"/>
    <!-- West -->
    <path d="M 20 72 C 19 67, 19 63, 20 58 C 34 56, 44 57, 53 61 C 54 63, 54 66, 53 69 C 44 73, 34 74, 20 72 Z"/>
    <!-- North-West -->
    <path d="M 34 40 C 39 35, 44 30, 50 26 C 54 36, 57 45, 61 53 C 62 56, 60 58, 58 60 C 50 58, 43 52, 34 40 Z"/>
  </g>

  <!-- Juicy Vesicle Droplets Texture on Wedges -->
  <g fill="#ffffff" opacity="0.35">
    <ellipse cx="64" cy="30" rx="1.8" ry="3.5"/>
    <ellipse cx="85" cy="42" rx="2" ry="3" transform="rotate(35 85 42)"/>
    <ellipse cx="94" cy="65" rx="3.5" ry="1.8"/>
    <ellipse cx="84" cy="88" rx="2" ry="3" transform="rotate(-35 84 88)"/>
    <ellipse cx="64" cy="98" rx="1.8" ry="3.5"/>
    <ellipse cx="44" cy="88" rx="2" ry="3" transform="rotate(35 44 88)"/>
    <ellipse cx="34" cy="65" rx="3.5" ry="1.8"/>
    <ellipse cx="43" cy="42" rx="2" ry="3" transform="rotate(-35 43 42)"/>
  </g>

  <!-- 4. Center Core Pith -->
  <circle cx="64" cy="65" r="9" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <circle cx="64" cy="65" r="4" fill="#ffedd5"/>

  <!-- 5. Fresh Cute Citrus Leaf with Stem (Top-Right Corner) -->
  <g transform="translate(10, -4)">
    <!-- Leaf Stem -->
    <path d="M 80 18 C 88 12, 98 12, 106 14" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Leaf Blade -->
    <path d="M 84 16 C 88 4, 108 2, 114 6 C 118 16, 102 24, 88 20 Z" fill="url(#orangeLeaf)" stroke="#14532d" stroke-width="1.5"/>
    <!-- Leaf Vein -->
    <path d="M 87 18 C 96 14, 106 11, 112 8" stroke="#dcfce7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- 6. Ultra-Glossy 3D Water Droplet Reflection -->
  <ellipse cx="46" cy="44" rx="8" ry="5" transform="rotate(-28 46 44)" fill="#ffffff" opacity="0.6"/>
  <circle cx="43" cy="42" r="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- Secondary Curved Bevel Glare -->
  <path d="M 22 36 C 36 22, 60 16, 80 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
