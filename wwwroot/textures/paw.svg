<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Soft fur shading rim -->
    <radialGradient id="pawBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Plump Pink Pad Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="40%" stop-color="#ff8da1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Pad drop shadow filter -->
    <filter id="padShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Shading Layer for Block Color Blending -->
  <rect width="128" height="128" rx="16" fill="url(#pawBase)"/>

  <!-- Fluffy Paw Contour (White soft background silhouette) -->
  <path d="M 20,45 C 16,70 24,105 45,116 C 54,120 74,120 83,116 C 104,105 112,70 108,45 C 104,24 88,24 80,35 C 72,22 56,22 48,35 C 40,24 24,24 20,45 Z" fill="#ffffff" opacity="0.3" filter="url(#padShadow)"/>

  <!-- Fur fluff tufts on edges -->
  <path d="M 18,65 Q 12,70 18,76 Q 13,82 22,86" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 110,65 Q 116,70 110,76 Q 115,82 106,86" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- TOE BEANS (3 Upper Plump Pads) -->
  <!-- Left Toe Bean -->
  <g transform="translate(34, 38)" filter="url(#padShadow)">
    <ellipse cx="0" cy="0" rx="13" ry="16" transform="rotate(-20)" fill="url(#padGrad)" stroke="#fda4af" stroke-width="1.8"/>
    <!-- Specular gleam -->
    <ellipse cx="-4" cy="-5" rx="4.5" ry="2.8" transform="rotate(-20 -4 -5)" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Middle (Center) Toe Bean (Slightly larger) -->
  <g transform="translate(64, 28)" filter="url(#padShadow)">
    <ellipse cx="0" cy="0" rx="14" ry="17" fill="url(#padGrad)" stroke="#fda4af" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-6" rx="5" ry="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Right Toe Bean -->
  <g transform="translate(94, 38)" filter="url(#padShadow)">
    <ellipse cx="0" cy="0" rx="13" ry="16" transform="rotate(20)" fill="url(#padGrad)" stroke="#fda4af" stroke-width="1.8"/>
    <ellipse cx="-3" cy="-6" rx="4.5" ry="2.8" transform="rotate(20 -3 -6)" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- MAIN PALM PAD (Chubby rounded inverted-heart bean) -->
  <g transform="translate(64, 82)" filter="url(#padShadow)">
    <path d="M 0,-18 C 16,-18 34,-6 32,16 C 30,30 18,34 0,32 C -18,34 -30,30 -32,16 C -34,-6 -16,-18 0,-18 Z" fill="url(#padGrad)" stroke="#fda4af" stroke-width="2"/>
    <!-- Palm Pad Specular Glint -->
    <ellipse cx="-12" cy="-4" rx="8" ry="4.5" transform="rotate(-25 -12 -4)" fill="#ffffff" opacity="0.85"/>
    <circle cx="-16" cy="8" r="2.2" fill="#ffffff" opacity="0.7"/>
    <!-- Cute little bottom shine -->
    <ellipse cx="10" cy="14" rx="5" ry="2.5" transform="rotate(15 10 14)" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Cute Sparkles around the paw -->
  <path d="M 18,22 L 20,15 L 22,22 L 29,24 L 22,26 L 20,33 L 18,26 L 11,24 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 104,18 L 105.5,13 L 107,18 L 112,19.5 L 107,21 L 105.5,26 L 104,21 L 99,19.5 Z" fill="#ffffff" opacity="0.8"/>
  <circle cx="112" cy="74" r="2" fill="#ffffff" opacity="0.75"/>
  <circle cx="16" cy="74" r="2" fill="#ffffff" opacity="0.75"/>

  <!-- Outer Rounded Gloss Rim -->
  <rect x="2" y="2" width="124" height="124" rx="14" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6"/>
</svg>
