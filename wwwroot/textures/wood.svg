<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfa46a"/>
      <stop offset="50%" stop-color="#c17c3e"/>
      <stop offset="100%" stop-color="#9a5720"/>
    </linearGradient>
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="botBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Wood Plank Base -->
  <rect width="128" height="128" rx="8" fill="url(#woodBase)"/>

  <!-- Cartoon Wood Grain Rings & Waves -->
  <path d="M0,24 C35,28 75,18 128,24" fill="none" stroke="#7e4115" stroke-width="2.5" opacity="0.45"/>
  <path d="M0,48 C45,54 85,42 128,48" fill="none" stroke="#7e4115" stroke-width="3" opacity="0.4"/>
  <path d="M0,52 C45,58 85,46 128,52" fill="none" stroke="#ffd1a4" stroke-width="1.5" opacity="0.5"/>

  <!-- Wood Knot -->
  <ellipse cx="86" cy="78" rx="14" ry="9" fill="none" stroke="#7e4115" stroke-width="2.5" opacity="0.5"/>
  <ellipse cx="86" cy="78" rx="7" ry="4.5" fill="#7e4115" opacity="0.4"/>
  <path d="M0,76 C35,80 62,72 72,78 C80,83 95,85 128,74" fill="none" stroke="#7e4115" stroke-width="2.5" opacity="0.45"/>

  <path d="M0,102 C40,108 80,98 128,104" fill="none" stroke="#7e4115" stroke-width="3" opacity="0.4"/>
  <path d="M0,106 C40,112 80,102 128,108" fill="none" stroke="#ffd1a4" stroke-width="1.5" opacity="0.5"/>

  <!-- Chamfer Bevel Framing (Toy block edges) -->
  <polygon points="0,0 128,0 114,14 14,14" fill="url(#topBevel)"/>
  <polygon points="0,0 14,14 14,114 0,128" fill="url(#topBevel)" opacity="0.7"/>
  <polygon points="128,0 128,128 114,114 114,14" fill="url(#botBevel)"/>
  <polygon points="0,128 14,114 114,114 128,128" fill="url(#botBevel)"/>
</svg>
