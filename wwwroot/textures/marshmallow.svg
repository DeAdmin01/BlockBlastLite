<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mallowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="toastGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Puffy Marshmallow Soft Cube -->
  <rect width="128" height="128" rx="28" fill="url(#mallowGrad)" stroke="#fcd34d" stroke-width="2"/>

  <!-- Golden Toasted Marshmallow Top Cap -->
  <path d="M 28 8 C 45 4, 83 4, 100 8 C 114 18, 114 36, 100 42 C 78 46, 50 46, 28 42 C 14 36, 14 18, 28 8 Z"
        fill="url(#toastGrad)" opacity="0.85"/>
  <ellipse cx="64" cy="22" rx="34" ry="12" fill="#fed7aa" opacity="0.5"/>

  <!-- Kawaii Cheeks -->
  <circle cx="34" cy="80" r="10" fill="#f472b6" opacity="0.6"/>
  <circle cx="94" cy="80" r="10" fill="#f472b6" opacity="0.6"/>

  <!-- Kawaii Winking Eyes -->
  <!-- Left Eye: Big and Round -->
  <ellipse cx="44" cy="68" rx="6" ry="8" fill="#451a03"/>
  <circle cx="42" cy="64" r="2.8" fill="#ffffff"/>
  <circle cx="46" cy="71" r="1.2" fill="#ffffff"/>

  <!-- Right Eye: Playful Wink (Curved line) -->
  <path d="M 78 68 Q 86 60 94 68" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Tiny Happy Kawaii Mouth (Open D shape) -->
  <path d="M 60 76 Q 64 86 68 76 Z" fill="#e11d48" stroke="#451a03" stroke-width="2"/>

  <!-- Soft Powder Puff highlights -->
  <circle cx="28" cy="100" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="98" cy="102" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="64" cy="110" r="2" fill="#ffffff" opacity="0.7"/>
</svg>
