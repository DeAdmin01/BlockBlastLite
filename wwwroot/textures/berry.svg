<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Forest Berry Wine Gradient -->
    <radialGradient id="berryBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </radialGradient>

    <!-- Juicy Drupelet Bead Gradient -->
    <radialGradient id="drupeletGrad" cx="36%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="75%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <!-- Green Leaf Crown Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Deep Berry Base Block -->
  <rect width="128" height="128" rx="16" fill="url(#berryBg)"/>

  <!-- JUICY CARTOON DRUPELETS (Round plump glossy beads) -->
  <!-- Layer 1 (Outer perimeter beads) -->
  <!-- Top row -->
  <g transform="translate(36, 40)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(64, 40)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(92, 40)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Middle row -->
  <g transform="translate(24, 68)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(50, 68)">
    <circle cx="0" cy="0" r="17" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-5" rx="5" ry="3" transform="rotate(-20 -4 -5)" fill="#ffffff" opacity="0.9"/>
  </g>
  <g transform="translate(78, 68)">
    <circle cx="0" cy="0" r="17" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-5" rx="5" ry="3" transform="rotate(-20 -4 -5)" fill="#ffffff" opacity="0.9"/>
  </g>
  <g transform="translate(104, 68)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Bottom row -->
  <g transform="translate(36, 96)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(64, 98)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(92, 96)">
    <circle cx="0" cy="0" r="16" fill="url(#drupeletGrad)" stroke="#4c0519" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="4.5" ry="2.8" transform="rotate(-20 -4 -4)" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- FRESH EMERALD CALYX / LEAF CROWN (Top center) -->
  <g transform="translate(64, 16)">
    <!-- Center stem -->
    <path d="M 0,0 Q 4,-10 10,-12" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 0,0 C -12,-8 -24,-2 -28,8 C -18,10 -8,4 0,0 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1.2"/>
    <path d="M 0,0 C -4,-12 4,-12 12,-6 C 10,2 4,4 0,0 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1.2"/>
    <path d="M 0,0 C 12,-8 24,-2 28,8 C 18,10 8,4 0,0 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-16" y2="4" stroke="#86efac" stroke-width="1"/>
    <line x1="0" y1="0" x2="16" y2="4" stroke="#86efac" stroke-width="1"/>
  </g>

  <!-- Juicy Specular Glints -->
  <circle cx="58" cy="54" r="2" fill="#ffffff"/>
  <circle cx="70" cy="82" r="2.2" fill="#ffffff"/>

  <!-- Outer Cartoon Rim -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="15" fill="none" stroke="#be123c" stroke-width="3" opacity="0.85"/>
</svg>
