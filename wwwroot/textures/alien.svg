<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="alienBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="alienSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <linearGradient id="saucerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="glowDome" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <!-- Background Space Container -->
  <rect width="128" height="128" rx="20" fill="url(#alienBg)"/>
  <circle cx="20" cy="24" r="1.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="110" cy="30" r="1.2" fill="#67e8f9" opacity="0.8"/>
  <circle cx="18" cy="100" r="1" fill="#f472b6" opacity="0.7"/>

  <!-- Alien Antenna -->
  <path d="M 64 36 Q 60 16 68 12" stroke="#22c55e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="68" cy="12" r="5" fill="#f43f5e"/>
  <circle cx="67" cy="10" r="1.8" fill="#ffffff"/>

  <!-- Glass Cockpit Dome -->
  <path d="M 32 80 C 32 36, 96 36, 96 80 Z" fill="url(#glowDome)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Cute Alien Head Inside -->
  <ellipse cx="64" cy="56" rx="22" ry="18" fill="url(#alienSkin)"/>
  
  <!-- Big Shiny Glossy Alien Eyes -->
  <g fill="#090d16">
    <ellipse cx="54" cy="54" rx="7" ry="9" transform="rotate(-15 54 54)"/>
    <ellipse cx="74" cy="54" rx="7" ry="9" transform="rotate(15 74 54)"/>
  </g>
  <!-- Eye Highlights -->
  <circle cx="53" cy="50" r="2.8" fill="#ffffff"/>
  <circle cx="56" cy="57" r="1.2" fill="#ffffff"/>
  <circle cx="73" cy="50" r="2.8" fill="#ffffff"/>
  <circle cx="76" cy="57" r="1.2" fill="#ffffff"/>

  <!-- Alien smile -->
  <path d="M 60 65 Q 64 68 68 65" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- UFO Metal Saucer Base -->
  <ellipse cx="64" cy="88" rx="46" ry="15" fill="url(#saucerGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="64" cy="85" rx="36" ry="7" fill="#334155"/>

  <!-- Saucer Neon Lights -->
  <circle cx="34" cy="88" r="3.5" fill="#fbbf24"/>
  <circle cx="54" cy="91" r="3.5" fill="#a855f7"/>
  <circle cx="74" cy="91" r="3.5" fill="#38bdf8"/>
  <circle cx="94" cy="88" r="3.5" fill="#4ade80"/>

  <!-- Cockpit Reflection Sweep -->
  <path d="M 42 46 Q 64 34 84 46" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none"/>
</svg>
