<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Cartoon Dreamy Aurora Gradient -->
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#f472b6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="auroraWave" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base soft cartoon pastel fill -->
  <rect width="128" height="128" rx="16" fill="url(#auroraSky)"/>

  <!-- Dreamy Cartoon Swirling Ribbons -->
  <path d="M-10,95 Q35,40 75,70 T140,45 L140,140 L-10,140 Z" fill="url(#auroraWave)" opacity="0.75"/>
  <path d="M-10,40 Q45,85 90,30 T140,60" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Cartoon Sparkle Stars -->
  <!-- Big 4-point cartoon star -->
  <path d="M96,28 Q96,38 106,38 Q96,38 96,48 Q96,38 86,38 Q96,38 96,28 Z" fill="#ffffff" filter="url(#softGlow)"/>
  <!-- Medium cartoon sparkle -->
  <path d="M32,74 Q32,80 38,80 Q32,80 32,86 Q32,80 26,80 Q32,80 32,74 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Small twinkle dots -->
  <circle cx="28" cy="30" r="3" fill="#ffffff" opacity="0.85"/>
  <circle cx="104" cy="88" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="68" cy="22" r="2" fill="#ffffff" opacity="0.7"/>

  <!-- Bubbly Gloss Highlight on top edge (Cartoon Bevel) -->
  <rect x="10" y="8" width="108" height="24" rx="12" fill="#ffffff" opacity="0.4"/>
  <circle cx="22" cy="18" r="4.5" fill="#ffffff" opacity="0.7"/>
</svg>
