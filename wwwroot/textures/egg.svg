<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Crisp Fried Egg Edge Warm Shadow -->
    <linearGradient id="skilletBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fba857"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shiny Egg White Radial Gradient -->
    <radialGradient id="eggWhite" cx="48%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Liquid Runny Egg Yolk Gradient -->
    <radialGradient id="yolkGrad" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <filter id="yolkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Crisp Golden Sizzled Border Block (Full bleed) -->
  <rect width="128" height="128" rx="16" fill="url(#skilletBg)"/>

  <!-- Crispy bubbly brown skillet edges -->
  <path d="M 0,0 L 128,0 L 128,24 C 96,16 32,16 0,24 Z" fill="#b45309" opacity="0.3"/>
  <circle cx="16" cy="18" r="3.5" fill="#92400e" opacity="0.4"/>
  <circle cx="112" cy="16" r="4" fill="#92400e" opacity="0.4"/>
  <circle cx="116" cy="112" r="3.5" fill="#92400e" opacity="0.4"/>
  <circle cx="14" cy="114" r="4" fill="#92400e" opacity="0.4"/>

  <!-- GLOSSY CARTOON EGG WHITE (Irregular organic puddle) -->
  <path d="M 12,24 C 18,8 44,10 64,12 C 84,10 110,8 116,24 C 124,44 122,84 116,104 C 110,120 84,118 64,116 C 44,118 18,120 12,104 C 4,84 6,44 12,24 Z" fill="url(#eggWhite)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Egg White Bubbles and Sizzle Spots -->
  <circle cx="28" cy="42" r="4.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="27" cy="40" r="1.5" fill="#ffffff"/>
  <circle cx="98" cy="82" r="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="97" cy="80" r="1.8" fill="#ffffff"/>
  <circle cx="34" cy="92" r="3.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
  <circle cx="94" cy="38" r="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- Black Pepper Speckles on White -->
  <circle cx="38" cy="28" r="1" fill="#334155"/>
  <circle cx="86" cy="26" r="1.1" fill="#334155"/>
  <circle cx="24" cy="74" r="0.9" fill="#334155"/>
  <circle cx="102" cy="62" r="1.2" fill="#334155"/>
  <circle cx="48" cy="106" r="1" fill="#334155"/>

  <!-- GIANT GLOSSY LIQUID SUNNY YOLK (Centered, high specular cartoon shine) -->
  <g filter="url(#yolkShadow)">
    <circle cx="64" cy="64" r="28" fill="url(#yolkGrad)" stroke="#c2410c" stroke-width="2.5"/>

    <!-- Yolk Specular Cartoon White Eye-Glints -->
    <ellipse cx="53" cy="52" rx="8" ry="5.5" transform="rotate(-30 53 52)" fill="#ffffff" opacity="0.95"/>
    <circle cx="45" cy="62" r="2.8" fill="#ffffff" opacity="0.85"/>
    <!-- Bottom right warm rim bounce reflection -->
    <path d="M 58,86 A 24 24 0 0 0 85,68" stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>
  </g>

  <!-- Salt / Sparkle Glint on Yolk -->
  <path d="M 78,44 L 80,39 L 82,44 L 87,45.5 L 82,47 L 80,52 L 78,47 L 73,45.5 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Outer Cartoon Sizzled Rim -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="15" fill="none" stroke="#b45309" stroke-width="3" opacity="0.85"/>
</svg>
