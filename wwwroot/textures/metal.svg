<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#cfd8dc" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#90a4ae" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#37474f" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="rivet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfd8dc"/>
      <stop offset="85%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#212121"/>
    </radialGradient>
  </defs>

  <!-- Steel Armor Chamfer Borders -->
  <polygon points="0,0 128,0 112,16 16,16" fill="#ffffff" opacity="0.8"/>
  <polygon points="0,0 16,16 16,112 0,128" fill="#ffffff" opacity="0.5"/>
  <polygon points="128,0 128,128 112,112 112,16" fill="#000000" opacity="0.6"/>
  <polygon points="0,128 16,112 112,112 128,128" fill="#000000" opacity="0.75"/>

  <!-- Center Steel Plate -->
  <rect x="16" y="16" width="96" height="96" rx="4" fill="url(#metalPlate)"/>
  <rect x="16" y="16" width="96" height="96" rx="4" fill="none" stroke="#263238" stroke-width="1.5" opacity="0.6"/>

  <!-- Diagonal brushed metal sheen streak -->
  <line x1="16" y1="90" x2="90" y2="16" stroke="#ffffff" stroke-width="6" opacity="0.65"/>
  <line x1="40" y1="112" x2="112" y2="40" stroke="#ffffff" stroke-width="3" opacity="0.45"/>

  <!-- 4 Corner Heavy-Duty Rivets / Bolts -->
  <!-- Top-Left Rivet -->
  <circle cx="28" cy="28" r="6" fill="url(#rivet)"/>
  <circle cx="28" cy="28" r="6" fill="none" stroke="#263238" stroke-width="1.2"/>
  <circle cx="26" cy="26" r="1.5" fill="#ffffff"/>

  <!-- Top-Right Rivet -->
  <circle cx="100" cy="28" r="6" fill="url(#rivet)"/>
  <circle cx="100" cy="28" r="6" fill="none" stroke="#263238" stroke-width="1.2"/>
  <circle cx="98" cy="26" r="1.5" fill="#ffffff"/>

  <!-- Bottom-Left Rivet -->
  <circle cx="28" cy="100" r="6" fill="url(#rivet)"/>
  <circle cx="28" cy="100" r="6" fill="none" stroke="#263238" stroke-width="1.2"/>
  <circle cx="26" cy="98" r="1.5" fill="#ffffff"/>

  <!-- Bottom-Right Rivet -->
  <circle cx="100" cy="100" r="6" fill="url(#rivet)"/>
  <circle cx="100" cy="100" r="6" fill="none" stroke="#263238" stroke-width="1.2"/>
  <circle cx="98" cy="98" r="1.5" fill="#ffffff"/>
</svg>
