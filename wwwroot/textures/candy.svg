<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="glaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="stripes" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="32" fill="#ffffff"/>
      <rect x="16" width="16" height="32" fill="rgba(0,0,0,0.18)"/>
      <line x1="8" y1="0" x2="8" y2="32" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    </pattern>
  </defs>
  <rect width="128" height="128" fill="url(#stripes)"/>
  <rect width="128" height="128" fill="url(#glaze)"/>
</svg>
