<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cyberGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Arcade Body -->
  <rect width="128" height="128" rx="14" fill="url(#matrixBg)"/>

  <!-- Cartoon Pixel Arcade Border -->
  <rect x="8" y="8" width="112" height="112" rx="8" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.85"/>
  <rect x="12" y="12" width="104" height="104" rx="6" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.6"/>

  <!-- Cartoon Pixel-Art Glyphs & Runes (Playful Arcade Style) -->
  <!-- Digital Pixel Star / Diamond (Center) -->
  <rect x="58" y="44" width="12" height="12" fill="#86efac" rx="2"/>
  <rect x="46" y="56" width="12" height="12" fill="#4ade80" rx="2"/>
  <rect x="58" y="56" width="12" height="12" fill="#ffffff" rx="2"/>
  <rect x="70" y="56" width="12" height="12" fill="#4ade80" rx="2"/>
  <rect x="58" y="68" width="12" height="12" fill="#86efac" rx="2"/>

  <!-- Top-left digital arcade sparkles -->
  <rect x="24" y="24" width="8" height="8" fill="#4ade80" rx="1"/>
  <rect x="32" y="32" width="6" height="6" fill="#86efac" rx="1"/>
  <rect x="22" y="36" width="6" height="6" fill="#22c55e" rx="1"/>

  <!-- Top-right digital dashes (stream) -->
  <rect x="92" y="20" width="10" height="4" fill="#86efac" rx="1"/>
  <rect x="94" y="28" width="6" height="4" fill="#4ade80" rx="1"/>
  <rect x="86" y="36" width="14" height="4" fill="#ffffff" rx="1"/>

  <!-- Bottom-right arcade plus -->
  <rect x="88" y="84" width="12" height="4" fill="#4ade80" rx="1"/>
  <rect x="92" y="80" width="4" height="12" fill="#4ade80" rx="1"/>

  <!-- Bottom-left pixel bit -->
  <rect x="26" y="88" width="10" height="10" fill="#22c55e" rx="2"/>
  <rect x="28" y="90" width="6" height="6" fill="#86efac" rx="1"/>

  <!-- Top Cartoon Bevel / Glass shine curve -->
  <path d="M16,14 L112,14 C112,14 100,30 64,30 C28,30 16,14 16,14 Z" fill="#ffffff" opacity="0.3"/>
</svg>
