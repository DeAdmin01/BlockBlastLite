<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#e60039"/>
      <stop offset="100%" stop-color="#990022"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="highlightGrad" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Berry Base Body -->
  <rect width="128" height="128" rx="20" fill="url(#berryGrad)"/>

  <!-- Seeds (Golden droplets) -->
  <g fill="#fde047" stroke="#b45309" stroke-width="0.8">
    <ellipse cx="28" cy="48" rx="2.5" ry="4" transform="rotate(-15 28 48)"/>
    <ellipse cx="64" cy="44" rx="2.5" ry="4"/>
    <ellipse cx="100" cy="48" rx="2.5" ry="4" transform="rotate(15 100 48)"/>
    <ellipse cx="44" cy="68" rx="2.5" ry="4" transform="rotate(-8 44 68)"/>
    <ellipse cx="84" cy="68" rx="2.5" ry="4" transform="rotate(8 84 68)"/>
    <ellipse cx="28" cy="88" rx="2.5" ry="4" transform="rotate(-12 28 88)"/>
    <ellipse cx="64" cy="88" rx="2.5" ry="4"/>
    <ellipse cx="100" cy="88" rx="2.5" ry="4" transform="rotate(12 100 88)"/>
    <ellipse cx="46" cy="108" rx="2.2" ry="3.5"/>
    <ellipse cx="82" cy="108" rx="2.2" ry="3.5"/>
    <ellipse cx="64" cy="116" rx="2" ry="3"/>
  </g>

  <!-- Luscious Green Leaf Crown at Top -->
  <g fill="url(#leafGrad)" stroke="#14532d" stroke-width="1.2">
    <!-- Center leaf -->
    <path d="M 64 22 C 60 12, 62 2, 64 2 C 66 2, 68 12, 64 22 Z"/>
    <!-- Left leaves -->
    <path d="M 60 16 C 45 10, 32 16, 26 24 C 36 26, 48 24, 58 18 Z"/>
    <path d="M 58 18 C 42 22, 36 32, 34 40 C 44 38, 52 32, 60 22 Z"/>
    <!-- Right leaves -->
    <path d="M 68 16 C 83 10, 96 16, 102 24 C 92 26, 80 24, 70 18 Z"/>
    <path d="M 70 18 C 86 22, 92 32, 94 40 C 84 38, 76 32, 68 22 Z"/>
  </g>

  <!-- Stem -->
  <path d="M 62 8 C 62 3, 66 1, 69 0 C 66 2, 65 5, 64 8 Z" fill="#15803d"/>

  <!-- Glossy 3D Highlight Curvature -->
  <path d="M 12 24 C 30 14, 98 14, 116 24 C 104 36, 24 36, 12 24 Z" fill="#ffffff" opacity="0.35"/>
  <circle cx="38" cy="38" r="16" fill="url(#highlightGrad)"/>
</svg>
