<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Dragon Emerald-Obsidian Gradient -->
    <radialGradient id="dragonBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <!-- Golden Scale Gradient -->
    <linearGradient id="goldScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Fiery Ember Glow Filter -->
    <filter id="emberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Emerald Dragon Hide Base -->
  <rect width="128" height="128" rx="16" fill="url(#dragonBg)"/>

  <!-- Dragon Scales Pattern (Layered overlapping cartoon scutes) -->
  <!-- Row 1 (Top) -->
  <path d="M 16,14 C 24,6 40,6 48,14 C 48,26 16,26 16,14 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 48,14 C 56,6 72,6 80,14 C 80,26 48,26 48,14 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 80,14 C 88,6 104,6 112,14 C 112,26 80,26 80,14 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>

  <!-- Row 2 -->
  <path d="M 32,32 C 40,22 56,22 64,32 C 64,44 32,44 32,32 Z" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <path d="M 64,32 C 72,22 88,22 96,32 C 96,44 64,44 64,32 Z" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <path d="M 0,32 C 8,22 24,22 32,32 C 32,44 0,44 0,32 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 96,32 C 104,22 120,22 128,32 C 128,44 96,44 96,32 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>

  <!-- Row 3 (Center Golden Armored Crest) -->
  <path d="M 48,56 C 56,42 72,42 80,56 C 80,72 48,72 48,56 Z" fill="url(#goldScale)" stroke="#fde047" stroke-width="2"/>
  <path d="M 16,56 C 24,44 40,44 48,56 C 48,70 16,70 16,56 Z" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <path d="M 80,56 C 88,44 104,44 112,56 C 112,70 80,70 80,56 Z" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>

  <!-- Row 4 -->
  <path d="M 32,80 C 40,68 56,68 64,80 C 64,94 32,94 32,80 Z" fill="url(#goldScale)" stroke="#fde047" stroke-width="1.8"/>
  <path d="M 64,80 C 72,68 88,68 96,80 C 96,94 64,94 64,80 Z" fill="url(#goldScale)" stroke="#fde047" stroke-width="1.8"/>
  <path d="M 0,80 C 8,68 24,68 32,80 C 32,94 0,94 0,80 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 96,80 C 104,68 120,68 128,80 C 128,94 96,94 96,80 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>

  <!-- Row 5 (Bottom) -->
  <path d="M 16,104 C 24,92 40,92 48,104 C 48,118 16,118 16,104 Z" fill="#047857" stroke="#059669" stroke-width="1.5"/>
  <path d="M 48,104 C 56,92 72,92 80,104 C 80,118 48,118 48,104 Z" fill="#059669" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 80,104 C 88,92 104,92 112,104 C 112,118 80,118 80,104 Z" fill="#047857" stroke="#059669" stroke-width="1.5"/>

  <!-- Golden Scale Highlights & Embers -->
  <circle cx="64" cy="52" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="48" cy="74" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="80" cy="74" r="2.5" fill="#ffffff" opacity="0.8"/>

  <!-- Floating Fire Embers -->
  <g filter="url(#emberGlow)">
    <circle cx="28" cy="24" r="2.5" fill="#f97316"/>
    <circle cx="102" cy="28" r="2" fill="#facc15"/>
    <circle cx="94" cy="98" r="2.8" fill="#ef4444"/>
    <circle cx="22" cy="92" r="2" fill="#f97316"/>
  </g>

  <!-- Outer Armored Rim -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="15" fill="none" stroke="#34d399" stroke-width="3" opacity="0.75"/>
</svg>
