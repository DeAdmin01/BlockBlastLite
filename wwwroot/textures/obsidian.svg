<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="obsidianBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1648"/>
      <stop offset="40%" stop-color="#160c2b"/>
      <stop offset="100%" stop-color="#0b0617"/>
    </linearGradient>
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Gem Base -->
  <rect width="128" height="128" rx="14" fill="url(#obsidianBase)"/>

  <!-- Chunky Cartoon Gemstone Facets (Cel-shaded polygon cuts) -->
  <!-- Top-left large facet -->
  <polygon points="12,12 70,12 50,56 12,48" fill="url(#facetHighlight)" opacity="0.85"/>
  <!-- Top-right wedge -->
  <polygon points="70,12 116,12 116,52 50,56" fill="#4c1d95" opacity="0.6"/>
  <!-- Center gem core -->
  <polygon points="50,56 116,52 86,104 36,92" fill="#2e1065" opacity="0.9"/>
  <!-- Bottom-left facet -->
  <polygon points="12,48 50,56 36,92 12,116" fill="url(#facetLight)" opacity="0.75"/>
  <!-- Bottom-right facet -->
  <polygon points="36,92 86,104 116,116 12,116" fill="#1e1136" opacity="0.95"/>
  <!-- Far right shard -->
  <polygon points="116,52 116,116 86,104" fill="#581c87" opacity="0.7"/>

  <!-- Bold Neon-Violet Cartoon Facet Creases -->
  <polyline points="12,12 50,56 116,52" fill="none" stroke="#d8b4fe" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="50" y1="56" x2="36" y2="92" stroke="#d8b4fe" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <polyline points="70,12 50,56 86,104" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <!-- Cartoon Specular Glints & Shine Dots -->
  <!-- 4-point cartoon shine star -->
  <path d="M48,46 Q48,56 58,56 Q48,56 48,66 Q48,56 38,56 Q48,56 48,46 Z" fill="#ffffff"/>
  <circle cx="50" cy="56" r="3" fill="#ffffff"/>
  <!-- Mini glint -->
  <circle cx="24" cy="22" r="3.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="98" cy="24" r="2.5" fill="#ffffff" opacity="0.85"/>
  <line x1="20" y1="16" x2="44" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
