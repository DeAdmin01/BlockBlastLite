<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Baked Golden Cookie Dough Gradient -->
    <radialGradient id="cookieDough" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#fba857"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Dark Chocolate Chunk Gradient -->
    <radialGradient id="chocoGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5c2c16"/>
      <stop offset="50%" stop-color="#3b1706"/>
      <stop offset="100%" stop-color="#1f0902"/>
    </radialGradient>
  </defs>

  <!-- Base Baked Cookie Block (Full bleed) -->
  <rect width="128" height="128" rx="16" fill="url(#cookieDough)"/>

  <!-- Bakery Oven Cracks & Crust Texture -->
  <path d="M 12,32 Q 28,38 42,30 Q 56,36 74,28" stroke="#92400e" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 64,84 Q 82,78 98,86 Q 112,80 120,88" stroke="#92400e" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 28,94 Q 38,82 48,90" stroke="#92400e" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 88,38 Q 98,46 112,40" stroke="#92400e" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Soft Flour Dusting flecks -->
  <circle cx="24" cy="56" r="3.5" fill="#fef3c7" opacity="0.7"/>
  <circle cx="96" cy="22" r="4" fill="#fef3c7" opacity="0.7"/>
  <circle cx="106" cy="68" r="3.2" fill="#fef3c7" opacity="0.6"/>
  <circle cx="48" cy="110" r="3.5" fill="#fef3c7" opacity="0.7"/>

  <!-- CHOCOLATE CHIPS / CHUNKS (Generously scattered) -->
  <!-- Chip 1 (Top Left, big chunk) -->
  <g transform="translate(32, 28)">
    <path d="M -12,-8 C -8,-14 6,-14 12,-6 C 16,2 10,12 0,14 C -10,14 -16,4 -12,-8 Z" fill="url(#chocoGrad)" stroke="#1f0902" stroke-width="1.5"/>
    <ellipse cx="-3" cy="-4" rx="4" ry="2.5" transform="rotate(-20 -3 -4)" fill="#854d0e" opacity="0.8"/>
    <circle cx="-5" cy="-5" r="1.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Chip 2 (Center, juicy round chip) -->
  <g transform="translate(68, 58)">
    <path d="M -14,-6 C -12,-16 4,-14 12,-8 C 18,0 12,14 2,16 C -8,16 -16,8 -14,-6 Z" fill="url(#chocoGrad)" stroke="#1f0902" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-4" rx="5" ry="3" transform="rotate(-15 -4 -4)" fill="#854d0e" opacity="0.8"/>
    <circle cx="-6" cy="-5" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Chip 3 (Bottom Left) -->
  <g transform="translate(36, 76)">
    <path d="M -10,-6 C -6,-12 8,-10 10,-4 C 14,4 6,12 0,12 C -8,12 -12,4 -10,-6 Z" fill="url(#chocoGrad)" stroke="#1f0902" stroke-width="1.5"/>
    <circle cx="-3" cy="-3" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Chip 4 (Top Right) -->
  <g transform="translate(92, 34)">
    <path d="M -10,-4 C -6,-10 6,-10 10,-4 C 12,2 8,10 0,10 C -8,10 -12,2 -10,-4 Z" fill="url(#chocoGrad)" stroke="#1f0902" stroke-width="1.5"/>
    <circle cx="-2" cy="-2" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Chip 5 (Bottom Right, big chunky drop) -->
  <g transform="translate(86, 94)">
    <path d="M -12,-8 C -8,-14 8,-12 12,-6 C 16,4 8,14 -2,14 C -10,14 -16,4 -12,-8 Z" fill="url(#chocoGrad)" stroke="#1f0902" stroke-width="1.5"/>
    <ellipse cx="-3" cy="-4" rx="4" ry="2.2" transform="rotate(-25 -3 -4)" fill="#854d0e" opacity="0.8"/>
    <circle cx="-5" cy="-5" r="1.8" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Golden specular surface gloss -->
  <path d="M 16,14 Q 64,22 112,14" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- Crunchy Outer Border -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="15" fill="none" stroke="#78350f" stroke-width="3" opacity="0.85"/>
</svg>
