<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Golden-Brown Baked Dough Gradient -->
    <linearGradient id="doughGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fba857"/>
      <stop offset="100%" stop-color="#c2630d"/>
    </linearGradient>
    <linearGradient id="innerHole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#220b02"/>
    </linearGradient>
    <!-- Cutout Mask: White is visible dough, Black is transparent window for colored glaze -->
    <mask id="glazeHoleMask">
      <!-- Full white background -->
      <rect width="128" height="128" fill="#ffffff"/>
      <!-- Black wavy glaze shape punches a transparent hole through the dough -->
      <path d="M 22,24 Q 42,16 64,22 Q 86,16 106,24 Q 116,42 110,64 Q 118,86 106,104 Q 86,114 64,108 Q 42,116 22,104 Q 10,86 18,64 Q 10,42 22,24 Z" fill="#000000"/>
      <!-- Center donut hole stays dough/dark so hole is not glaze -->
      <ellipse cx="64" cy="64" rx="20" ry="19" fill="#ffffff"/>
    </mask>
  </defs>

  <!-- Dough Layer: masked so the wavy glaze area is a crystal-clear window to CSS block color -->
  <rect width="128" height="128" rx="16" fill="url(#doughGrad)" mask="url(#glazeHoleMask)"/>
  <!-- Crust edge outline for cartoon definition -->
  <rect x="2" y="2" width="124" height="124" rx="14" fill="none" stroke="#78350f" stroke-width="2.5" opacity="0.65"/>

  <!-- Center Donut Hole (Deep 3D baked shadow) -->
  <ellipse cx="64" cy="64" rx="20" ry="19" fill="url(#innerHole)" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="64" cy="63" rx="16" ry="15" fill="#1b0802"/>

  <!-- Glaze 3D Depth Rim (Border of the wavy glaze dripping onto the dough) -->
  <path d="M 22,24 Q 42,16 64,22 Q 86,16 106,24 Q 116,42 110,64 Q 118,86 106,104 Q 86,114 64,108 Q 42,116 22,104 Q 10,86 18,64 Q 10,42 22,24 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M 23,26 Q 42,18 64,24 Q 86,18 105,26 Q 114,43 109,64 Q 116,85 105,102 Q 86,112 64,106 Q 42,114 23,102 Q 12,85 19,64 Q 12,43 23,26 Z" fill="none" stroke="#000000" stroke-width="2" opacity="0.25"/>

  <!-- Top Specular Gloss Highlight across the Glaze -->
  <path d="M 28,30 Q 64,18 100,30 Q 64,24 28,30 Z" fill="#ffffff" opacity="0.65"/>
  <circle cx="34" cy="34" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="94" cy="34" r="2.5" fill="#ffffff" opacity="0.8"/>

  <!-- Colorful Confetti Sprinkles (Festive Rainbow Toppings on the Glaze) -->
  <!-- White Sprinkles -->
  <rect x="42" y="30" width="10" height="4.5" rx="2.2" transform="rotate(-30 42 30)" fill="#ffffff"/>
  <rect x="78" y="32" width="10" height="4.5" rx="2.2" transform="rotate(40 78 32)" fill="#ffffff"/>
  <rect x="62" y="96" width="10" height="4.5" rx="2.2" transform="rotate(15 62 96)" fill="#ffffff"/>
  <!-- Bright Yellow Sprinkles -->
  <rect x="28" y="52" width="9" height="4.2" rx="2.1" transform="rotate(65 28 52)" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
  <rect x="96" y="54" width="9" height="4.2" rx="2.1" transform="rotate(-50 96 54)" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
  <!-- Sky Cyan Sprinkles -->
  <rect x="36" y="80" width="10" height="4.5" rx="2.2" transform="rotate(-20 36 80)" fill="#67e8f9" stroke="#0891b2" stroke-width="0.8"/>
  <rect x="88" y="78" width="10" height="4.5" rx="2.2" transform="rotate(35 88 78)" fill="#67e8f9" stroke="#0891b2" stroke-width="0.8"/>
  <!-- Vivid Coral / Red Sprinkles -->
  <rect x="60" y="24" width="9" height="4.2" rx="2.1" transform="rotate(10 60 24)" fill="#f43f5e" stroke="#9f1239" stroke-width="0.8"/>
  <rect x="44" y="94" width="9" height="4.2" rx="2.1" transform="rotate(-40 44 94)" fill="#f43f5e" stroke="#9f1239" stroke-width="0.8"/>
  <!-- Candy Purple Sprinkles -->
  <rect x="82" y="94" width="9" height="4.2" rx="2.1" transform="rotate(-30 82 94)" fill="#c084fc" stroke="#7e22ce" stroke-width="0.8"/>
  <rect x="24" y="68" width="9" height="4.2" rx="2.1" transform="rotate(15 24 68)" fill="#c084fc" stroke="#7e22ce" stroke-width="0.8"/>

  <!-- Round Nonpareil Sprinkles (Tiny sugar balls) -->
  <circle cx="52" cy="40" r="2.5" fill="#facc15"/>
  <circle cx="72" cy="40" r="2.5" fill="#38bdf8"/>
  <circle cx="102" cy="68" r="2.5" fill="#f43f5e"/>
  <circle cx="28" cy="40" r="2.5" fill="#4ade80"/>
  <circle cx="74" cy="98" r="2.5" fill="#fbbf24"/>
</svg>
