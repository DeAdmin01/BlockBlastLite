<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="deepSpace" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="planetBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Indigo Base -->
  <rect width="128" height="128" rx="20" fill="url(#deepSpace)"/>

  <!-- Background Distant Stars -->
  <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="112" cy="24" r="2" fill="#fde047" opacity="0.9"/>
  <circle cx="16" cy="98" r="1.2" fill="#67e8f9" opacity="0.7"/>
  <circle cx="114" cy="106" r="1.5" fill="#ffffff" opacity="0.8"/>
  <polygon points="32,32 33,35 36,36 33,37 32,40 31,37 28,36 31,35" fill="#ffffff" opacity="0.9"/>

  <!-- Back Half of Planetary Ring -->
  <g transform="rotate(-25 64 64)">
    <ellipse cx="64" cy="64" rx="58" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity="0.6"/>
    <ellipse cx="64" cy="64" rx="52" ry="10" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Main Celestial Planet Sphere -->
  <circle cx="64" cy="64" r="34" fill="url(#planetBody)" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Atmospheric Swirl / Cloud Stripes -->
  <path d="M 32 58 Q 64 74 96 58 C 94 62, 88 66, 80 66 Q 64 78 40 64 Z" fill="#38bdf8" opacity="0.5"/>
  <path d="M 36 72 Q 64 86 92 72 C 88 76, 80 80, 64 80 Q 48 80 36 72 Z" fill="#c084fc" opacity="0.5"/>

  <!-- Front Half of Planetary Ring (Cutting in front of sphere) -->
  <g transform="rotate(-25 64 64)">
    <!-- Masked arc to appear in front -->
    <path d="M 6 64 A 58 14 0 0 0 122 64" fill="none" stroke="url(#ringGrad)" stroke-width="7"/>
    <path d="M 12 64 A 52 10 0 0 0 116 64" fill="none" stroke="#fef08a" stroke-width="2"/>
  </g>

  <!-- Planet 3D Glow Highlight -->
  <ellipse cx="52" cy="46" rx="14" ry="8" transform="rotate(-30 52 46)" fill="#ffffff" opacity="0.35"/>
  <circle cx="48" cy="42" r="3" fill="#ffffff" opacity="0.7"/>
</svg>
