<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Robot Steel Cyan Gradient -->
    <linearGradient id="robotMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- CRT Screen Dark Glow -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Cyan Visor Display Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Robot Metal Head Block (Edge to edge) -->
  <rect width="128" height="128" rx="16" fill="url(#robotMetal)"/>

  <!-- Corner Bolts & Rivets -->
  <circle cx="14" cy="14" r="4.5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="11" y1="14" x2="17" y2="14" stroke="#475569" stroke-width="1.2"/>
  <circle cx="114" cy="14" r="4.5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="111" y1="14" x2="117" y2="14" stroke="#475569" stroke-width="1.2"/>
  <circle cx="14" cy="114" r="4.5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="11" y1="114" x2="17" y2="114" stroke="#475569" stroke-width="1.2"/>
  <circle cx="114" cy="114" r="4.5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="111" y1="114" x2="117" y2="114" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Center Antenna / Light Bulb -->
  <path d="M 60,6 L 68,6 L 66,16 L 62,16 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="64" cy="6" r="4.5" fill="#facc15" stroke="#ca8a04" stroke-width="1.2" filter="url(#neonGlow)"/>

  <!-- CRT Monitor Screen (Recessed central display) -->
  <rect x="20" y="24" width="88" height="74" rx="14" fill="url(#screenBg)" stroke="#0f172a" stroke-width="3"/>
  <rect x="22" y="26" width="84" height="70" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Screen Scanlines -->
  <line x1="22" y1="36" x2="106" y2="36" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="46" x2="106" y2="46" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="56" x2="106" y2="56" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="66" x2="106" y2="66" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="76" x2="106" y2="76" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="86" x2="106" y2="86" stroke="#1e293b" stroke-width="1" opacity="0.6"/>

  <!-- Cute Digital Robot Face (Glowing Cyan LED Eyes & Mouth) -->
  <g filter="url(#neonGlow)">
    <!-- Left Eye (Happy chevron/arc ^) -->
    <path d="M 38,54 L 46,44 L 54,54" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Eye (Happy chevron/arc ^) -->
    <path d="M 74,54 L 82,44 L 90,54" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cute Pixel Smile -->
    <path d="M 52,72 Q 64,80 76,72" stroke="#22d3ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Screen Glass Glint (Curved white reflection) -->
  <path d="M 28,30 L 98,30 Q 98,42 84,48 L 28,48 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Speaker Grille / Audio vents at bottom -->
  <circle cx="48" cy="108" r="2" fill="#0f172a"/>
  <circle cx="56" cy="108" r="2" fill="#0f172a"/>
  <circle cx="64" cy="108" r="2" fill="#0f172a"/>
  <circle cx="72" cy="108" r="2" fill="#0f172a"/>
  <circle cx="80" cy="108" r="2" fill="#0f172a"/>

  <!-- Heavy Cartoon Rim -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="15" fill="none" stroke="#0f172a" stroke-width="3" opacity="0.9"/>
</svg>
